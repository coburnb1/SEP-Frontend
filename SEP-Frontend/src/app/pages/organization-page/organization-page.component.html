<div class="body">

  <div class="container-fluid d-flex justify-content-center ">
    <div class="col-3 border rounded m-2 mb-1">
      <div class="row">
        <div class="p-4">
          <h3 class="text-center ">Organizations</h3>
          <hr />
          <!--loaded in with JS-->
          <div class="p-4 pb-1 pt-1" (click)="showButton()">
            <h4 class="text-left">Organization Name</h4>
            <div class="row ms-4">
              <div class="col-sm text-left p-2">
                Groups # <!--count of groups-->
              </div>
              <div class="col-sm text-right p-2">
                Member # <!--count of members-->
              </div>
            </div>
            <hr />
          </div>

          <!--loaded in with JS-->
          <div class="p-4 pb-1 pt-1" (click)="showButton()">
            <h4 class="text-left">Organization Name</h4>
            <div class="row ms-4">
              <div class="col-sm text-left p-2">
                Groups #
              </div>
              <div class="col-sm text-right p-2">
                Member #
              </div>
            </div>
            <hr />
          </div>

          <!--loaded in with JS-->
          <div class="p-4 pb-1 pt-1" (click)="showButton()">
            <h4 class="text-left">Organization Name</h4>
            <div class="row ms-4">
              <div class="col-sm text-left p-2">
                Groups #
              </div>
              <div class="col-sm text-right p-2">
                Member #
              </div>
            </div>
            <hr />
          </div>

        </div>
      </div>

    </div>
    <div class="col-7 border rounded m-2">
      <div class="row">
        <div class="p-3">
          <button type="button" class="btn btn-lg btn-primary float-end me-3" data-bs-toggle="modal"
                  data-bs-target="#exampleModal">
            <i class="bi bi-plus-circle-dotted "></i>
          </button>
          <button type="button" class="btn btn-lg btn-primary float-end me-3"><!--refresh data-->
            <i class="bi bi-arrow-repeat"></i>
          </button>

          <!--button appears when organization is selected-->
          <a class="btn btn-lg btn-primary float-end me-3" role="button" *ngIf="isButtonVisible" href="#">
            <i class="bi bi-people-fill"></i>
          </a>

        </div>
        <div>
          <app-calendar></app-calendar>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- create new popup -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Create New Organization</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">

          <div class="form-floating mb-2">
            <input class="form-control" id="floatingInput" placeholder="Organization Name" [(ngModel)]="organizationName" name="orgName">
            <label for="floatingInput">Organization Name</label>
          </div>
          <button class="btn btn-info mb-2 float-end" (click)="addAttribute()">Add Attribute</button>
        </div>
        <div class="mb-3">
          <div *ngFor="let attr of attributes; let i = index" class="mb-4 p-3 border rounded">
            <input type="text" class="form-control mb-2" placeholder="Attribute Name" [(ngModel)]="attr.name" [name]="'attrName' + i">

            <div class="response-options ms-3">
              <div *ngFor="let option of attr.options; let j = index">
                <input type="text" class="form-control mb-2" placeholder="Response Option" [(ngModel)]="attr.options[j]" [name]="'option' + i + '_' + j">
              </div>
            </div>

            <div class="mt-3 text-end">
              <button type="button" class="btn btn-secondary me-2" (click)="addOption(i)">Add Option</button>
              <button type="button" class="btn btn-danger" (click)="removeAttribute(i)">Remove</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <label>Generate Link</label>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal"><i class="bi bi-link"></i></button>
      </div>
    </div>
  </div>
</div>
